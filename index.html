<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />
    <script src="map.js" type="module"></script>
  </head>
  <body>
    <h1>🚴🏼‍♀️ Bikewatching</h1>
    <p> This map shows you bike traffic in the Boston area at different times of the day. 
        Circles represent BlueBike stations and the size represents the amount of traffic at each stations.
        Use the slider to change the time of day you are viewing.
    </p>
    <label>
    Filter by time:
    <input id="time-slider" type="range" min="-1" max="1440" step="1" value="-1">
    <time id="selected-time" datetime="any">--:--</time>
    <em id="any-time">(any time)</em>
  </label>
    <div id="map">
        <svg></svg>
    </div>
  </body>
</html>
